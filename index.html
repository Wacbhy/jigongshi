<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d4a843">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>工时记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c;--surface:#13131a;--surface-2:#1c1c26;--surface-3:#222230;
  --border:#2a2a3a;--accent:#d4a843;--accent-dim:#8b7230;
  --accent-glow:rgba(212,168,67,0.15);
  --text:#e8e4dc;--text-muted:#6b6878;
  --success:#4ecb71;--danger:#e05252;
  --info:#5b9ef0;--purple:#a87de8;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 20%,rgba(212,168,67,0.04) 0%,transparent 50%),radial-gradient(ellipse at 85% 80%,rgba(100,60,180,0.03) 0%,transparent 50%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:24px 16px 100px}

/* Header */
.header{text-align:center;margin-bottom:32px;animation:fadeDown .6s ease}
.header-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--accent),#c49030);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;box-shadow:0 8px 32px rgba(212,168,67,0.2)}
.header h1{font-size:22px;font-weight:700;letter-spacing:-0.5px}

/* Summary */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px;animation:fadeUp .6s ease .1s both}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 8px;text-align:center;position:relative;overflow:hidden;transition:border-color .3s}
.summary-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,var(--accent));opacity:.5}
.summary-card .label{font-size:10px;color:var(--text-muted);letter-spacing:.5px;margin-bottom:6px}
.summary-card .value{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--card-accent,var(--accent))}
.summary-card .unit{font-size:11px;color:var(--text-muted)}
.accent-gold{--card-accent:var(--accent)}.accent-green{--card-accent:var(--success)}
.accent-blue{--card-accent:var(--info)}.accent-purple{--card-accent:var(--purple)}

/* Add Button */
.fab-bar{display:flex;gap:10px;margin-bottom:24px;animation:fadeUp .6s ease .15s both}
.fab{flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text-muted);font-family:'Noto Sans SC',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.fab:hover{border-color:var(--accent-dim);color:var(--accent)}
.fab .fab-icon{font-size:16px}
.fab.active{background:var(--accent-glow);border-color:var(--accent-dim);color:var(--accent)}

/* Quick Add Panel */
.quick-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:28px;animation:slideDown .3s ease;overflow:hidden}
.quick-panel.hidden{display:none}
.qp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.qp-header h3{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.qp-header h3::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px}
.qp-close{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px}

/* Type chips */
.type-chips{display:flex;gap:6px;margin-bottom:16px}
.type-chip{flex:1;padding:10px 0;text-align:center;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;transition:all .2s;user-select:none}
.type-chip:hover{border-color:var(--accent-dim)}
.type-chip.active{color:#0a0a0c;font-weight:700}
.type-chip.active[data-t="normal"]{background:var(--accent);border-color:var(--accent)}
.type-chip.active[data-t="tiaoxiu"]{background:var(--purple);border-color:var(--purple)}
.type-chip.active[data-t="zhuanban"]{background:var(--info);border-color:var(--info)}

/* Form compact */
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;color:var(--text-muted)}
.fg input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;outline:none;transition:border-color .2s;width:100%}
.fg input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.fg input[type="date"]::-webkit-calendar-picker-indicator,.fg input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
.frow{display:grid;gap:10px;margin-bottom:10px}
.frow.c2{grid-template-columns:1fr 1fr}
.frow.c3{grid-template-columns:1fr 1fr 1fr}
.frow.c4{grid-template-columns:1fr 1fr 1fr 1fr}

.shift-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sc{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:11px;padding:5px 12px;border-radius:16px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .2s}
.sc:hover,.sc.on{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow)}

.submit-row{display:flex;gap:8px;margin-top:14px}
.btn{padding:11px 20px;border:none;border-radius:8px;font-family:'Noto Sans SC',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-gold{background:linear-gradient(135deg,var(--accent),#c49030);color:#0a0a0c;flex:1}
.btn-gold:hover{box-shadow:0 4px 16px rgba(212,168,67,.3)}
.btn-gold.purple{background:linear-gradient(135deg,var(--purple),#7c5bc4)}
.btn-gold.blue{background:linear-gradient(135deg,var(--info),#3a7ab8)}
.btn-ghost{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);font-size:12px;padding:8px 14px}
.btn-ghost:hover{color:var(--text);border-color:var(--text-muted)}

/* Calendar */
.cal-section{animation:fadeUp .6s ease .2s both}
.cal-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}

.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
.cal-nav button{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;padding:4px 10px;border-radius:6px;transition:all .2s}
.cal-nav button:hover{color:var(--accent);background:var(--surface-2)}
.cal-nav .cal-title{font-size:15px;font-weight:600;letter-spacing:1px}
.cal-nav .cal-today{font-size:11px;color:var(--accent);cursor:pointer;background:var(--accent-glow);border:1px solid var(--accent-dim);padding:3px 10px;border-radius:12px;font-family:'Noto Sans SC',sans-serif}

.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px 8px;text-align:center}
.cal-weekdays span{font-size:11px;color:var(--text-muted);font-weight:500}
.cal-weekdays span:first-child{color:var(--danger)}
.cal-weekdays span:last-child{color:var(--danger)}

.cal-days{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px 16px;gap:4px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;transition:all .15s;font-size:14px;position:relative;user-select:none}
.cal-day:hover{background:var(--surface-2)}
.cal-day.today{font-weight:700;color:var(--accent)}
.cal-day.today::after{content:'';position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal-day.selected{background:var(--accent)!important;color:#0a0a0c!important;font-weight:700}
.cal-day.selected::after{background:#0a0a0c!important}
.cal-day.other{color:var(--surface-3);font-size:12px}
.cal-day .dots{display:flex;gap:2px;margin-top:2px;height:4px;align-items:center}
.cal-day .dot{width:4px;height:4px;border-radius:50%}
.cal-day .dot.d-normal{background:var(--accent)}
.cal-day .dot.d-tx{background:var(--purple)}
.cal-day .dot.d-zb{background:var(--info)}

/* Day Detail */
.day-detail{margin-top:12px;animation:fadeUp .25s ease}
.day-detail.hidden{display:none}
.dd-header{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 10px}
.dd-header .dd-date{font-size:15px;font-weight:600}
.dd-header .dd-weekday{color:var(--text-muted);font-size:13px;margin-left:8px}
.dd-header .dd-total{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent)}

.dd-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;position:relative;transition:border-color .2s}
.dd-card::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0}
.dd-card.t-normal::before{background:var(--accent)}
.dd-card.t-tiaoxiu::before{background:var(--purple)}
.dd-card.t-zhuanban::before{background:var(--info)}
.dd-card:hover{border-color:var(--accent-dim)}
.dd-left{padding-left:10px;flex:1;min-width:0}
.dd-left .dd-type{font-size:11px;font-weight:600;margin-bottom:4px}
.dd-left .dd-type.c-gold{color:var(--accent)}.dd-left .dd-type.c-purple{color:var(--purple)}.dd-left .dd-type.c-blue{color:var(--info)}
.dd-left .dd-info{font-size:12px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dd-left .dd-info .sep{color:var(--border)}
.dd-right{text-align:right;min-width:80px;padding-left:12px}
.dd-right .dd-hours{font-family:'Space Mono',monospace;font-size:17px;font-weight:700}
.dd-right .dd-earning{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;color:var(--accent)}
.dd-right .dd-lbl{font-size:10px;color:var(--text-muted)}
.dd-del{background:none;border:none;color:var(--text-muted);font-size:14px;cursor:pointer;padding:4px 0 4px 10px;opacity:.4;transition:all .2s}
.dd-del:hover{color:var(--danger);opacity:1}

.dd-empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px}

/* Animations */
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;max-height:0}to{opacity:1;max-height:600px}}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 22px;border-radius:10px;font-size:13px;z-index:100;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .app{padding:16px 12px 80px}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  .frow.c3,.frow.c4{grid-template-columns:1fr 1fr}
  .fab-bar{flex-direction:row}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-icon">&#9201;</div>
    <h1>工时记录</h1>
  </div>

  <!-- Summary -->
  <div class="summary-grid">
    <div class="summary-card accent-gold"><div class="label">本月工时</div><div class="value" id="sHours">0.0</div><div class="unit">小时</div></div>
    <div class="summary-card accent-green"><div class="label">本月收入</div><div class="value" id="sEarn">0</div><div class="unit">元</div></div>
    <div class="summary-card accent-purple"><div class="label">调休/转班</div><div class="value" id="sSpecial">0</div><div class="unit">天</div></div>
    <div class="summary-card accent-blue"><div class="label">打卡天数</div><div class="value" id="sDays">0</div><div class="unit">天</div></div>
  </div>

  <!-- FAB Bar -->
  <div class="fab-bar">
    <button class="fab" id="fabNormal" onclick="openPanel('normal')"><span class="fab-icon">&#43;</span> 正常打卡</button>
    <button class="fab" id="fabTx" onclick="openPanel('tiaoxiu')"><span class="fab-icon">&#127881;</span> 调休</button>
    <button class="fab" id="fabZb" onclick="openPanel('zhuanban')"><span class="fab-icon">&#128260;</span> 转班</button>
  </div>

  <!-- Quick Add Panel -->
  <div class="quick-panel hidden" id="quickPanel">
    <div class="qp-header">
      <h3 id="panelTitle">新增打卡</h3>
      <button class="qp-close" onclick="closePanel()">&#10005;</button>
    </div>

    <!-- Normal Form -->
    <div id="pNormal">
      <div class="frow c3">
        <div class="fg"><label>日期</label><input type="date" id="nDate"></div>
        <div class="fg"><label>上班</label><input type="time" id="nStart" value="09:00"></div>
        <div class="fg"><label>下班</label><input type="time" id="nEnd" value="18:00"></div>
      </div>
      <div class="shift-chips">
        <span class="sc" onclick="setShift('09:00','18:00')">9-18</span>
        <span class="sc" onclick="setShift('08:00','17:00')">8-17</span>
        <span class="sc" onclick="setShift('10:00','19:00')">10-19</span>
        <span class="sc" onclick="setShift('09:00','21:00')">9-21</span>
      </div>
      <div class="frow c4">
        <div class="fg"><label>休息(分)</label><input type="number" id="nBreak" value="60" min="0" step="15"></div>
        <div class="fg"><label>时薪(元)</label><input type="number" id="nRate" placeholder="50" min="0" step="0.5"></div>
        <div class="fg"><label>备注</label><input type="text" id="nNote" placeholder="可选"></div>
        <div class="fg" style="justify-content:flex-end">
          <div class="shift-chips" style="margin:0">
            <span class="sc brk" onclick="setBrk(0)">无休</span>
            <span class="sc brk" onclick="setBrk(30)">30分</span>
            <span class="sc brk on" onclick="setBrk(60)">1h</span>
            <span class="sc brk" onclick="setBrk(90)">1.5h</span>
          </div>
        </div>
      </div>
      <div class="submit-row">
        <button class="btn btn-gold" onclick="addNormal()">记录打卡</button>
        <button class="btn btn-ghost" onclick="fillNow('normal')">现在</button>
      </div>
    </div>

    <!-- Tiaoxiu Form -->
    <div id="pTx" class="hidden">
      <div class="frow c3">
        <div class="fg"><label>日期</label><input type="date" id="txDate"></div>
        <div class="fg"><label>时长(小时)</label><input type="number" id="txHours" value="8" min="0.5" step="0.5"></div>
        <div class="fg"><label>原因</label><input type="text" id="txReason" placeholder="可选"></div>
      </div>
      <div class="submit-row">
        <button class="btn btn-gold purple" onclick="addTx()">记录调休</button>
      </div>
    </div>

    <!-- Zhuanban Form -->
    <div id="pZb" class="hidden">
      <div class="frow c3">
        <div class="fg"><label>转班日期</label><input type="date" id="zbDate"></div>
        <div class="fg"><label>上班</label><input type="time" id="zbStart" value="09:00"></div>
        <div class="fg"><label>下班</label><input type="time" id="zbEnd" value="18:00"></div>
      </div>
      <div class="frow c4">
        <div class="fg"><label>休息(分)</label><input type="number" id="zbBreak" value="60" min="0" step="15"></div>
        <div class="fg"><label>时薪(元)</label><input type="number" id="zbRate" placeholder="50" min="0" step="0.5"></div>
        <div class="fg"><label>原休日期</label><input type="date" id="zbOrig"></div>
        <div class="fg"><label>备注</label><input type="text" id="zbNote" placeholder="可选"></div>
      </div>
      <div class="submit-row">
        <button class="btn btn-gold blue" onclick="addZb()">记录转班</button>
        <button class="btn btn-ghost" onclick="fillNow('zb')">现在</button>
      </div>
    </div>
  </div>

  <!-- Calendar -->
  <div class="cal-section">
    <div class="cal-wrap">
      <div class="cal-nav">
        <button onclick="calNav(-1)">&#8249;</button>
        <span class="cal-title" id="calTitle"></span>
        <button onclick="calNav(1)">&#8250;</button>
      </div>
      <div style="text-align:center;padding-bottom:8px">
        <span class="cal-nav .cal-today" style="cursor:pointer;font-size:11px;color:var(--accent);background:var(--accent-glow);border:1px solid var(--accent-dim);padding:3px 10px;border-radius:12px" onclick="goToday()">今天</span>
      </div>
      <div class="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>

    <!-- Day Detail -->
    <div class="day-detail hidden" id="dayDetail"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WD=['周日','周一','周二','周三','周四','周五','周六'];
let records=JSON.parse(localStorage.getItem('workRecordsV3')||'[]');
records=records.map(r=>({...r,type:r.type||'normal',breakMin:r.breakMin!==undefined?r.breakMin:60}));

let calYear,calMonth;// 0-indexed
let selectedDate=null;

const now=new Date();
calYear=now.getFullYear();
calMonth=now.getMonth();

// Init dates
const todayStr=fmtDate(now);
document.getElementById('nDate').value=todayStr;
document.getElementById('txDate').value=todayStr;
document.getElementById('zbDate').value=todayStr;

const sr=localStorage.getItem('workRate');
if(sr){document.getElementById('nRate').value=sr;document.getElementById('zbRate').value=sr;}

function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// === Panel ===
let panelType=null;
function openPanel(type){
  panelType=type;
  document.getElementById('quickPanel').classList.remove('hidden');
  document.getElementById('pNormal').classList.toggle('hidden',type!=='normal');
  document.getElementById('pTx').classList.toggle('hidden',type!=='tiaoxiu');
  document.getElementById('pZb').classList.toggle('hidden',type!=='zhuanban');
  document.getElementById('fabNormal').classList.toggle('active',type==='normal');
  document.getElementById('fabTx').classList.toggle('active',type==='tiaoxiu');
  document.getElementById('fabZb').classList.toggle('active',type==='zhuanban');
  const t=document.getElementById('panelTitle');
  if(type==='normal')t.textContent='新增打卡';
  if(type==='tiaoxiu')t.textContent='记录调休';
  if(type==='zhuanban')t.textContent='记录转班';

  // Set date to selectedDate if any
  if(selectedDate){
    if(type==='normal')document.getElementById('nDate').value=selectedDate;
    if(type==='tiaoxiu')document.getElementById('txDate').value=selectedDate;
    if(type==='zhuanban')document.getElementById('zbDate').value=selectedDate;
  }
}
function closePanel(){
  document.getElementById('quickPanel').classList.add('hidden');
  document.getElementById('fabNormal').classList.remove('active');
  document.getElementById('fabTx').classList.remove('active');
  document.getElementById('fabZb').classList.remove('active');
  panelType=null;
}
function setShift(s,e){document.getElementById('nStart').value=s;document.getElementById('nEnd').value=e;}
function setBrk(m){
  document.getElementById('nBreak').value=m;
  const map={'无休':0,'30分':30,'1h':60,'1.5h':90};
  document.querySelectorAll('.brk').forEach(el=>el.classList.toggle('on',map[el.textContent]===m));
}
function fillNow(t){
  const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if(t==='normal'){document.getElementById('nEnd').value=hm;document.getElementById('nDate').value=todayStr;}
  if(t==='zb'){document.getElementById('zbEnd').value=hm;document.getElementById('zbDate').value=todayStr;}
  showToast('已填充');
}

// === Calc ===
function calcRaw(s,e){const[sh,sm]=s.split(':').map(Number);const[eh,em]=e.split(':').map(Number);let m=(eh*60+em)-(sh*60+sm);if(m<0)m+=1440;return m;}
function fmtBrk(m){if(m===0)return'无休息';if(m<60)return m+'分钟';const h=Math.floor(m/60),r=m%60;return r?h+'h'+r+'m':h+'h';}

// === Add Records ===
function addNormal(){
  const date=document.getElementById('nDate').value,start=document.getElementById('nStart').value,end=document.getElementById('nEnd').value;
  const brk=parseInt(document.getElementById('nBreak').value)||0,rate=parseFloat(document.getElementById('nRate').value),note=document.getElementById('nNote').value.trim();
  if(!date||!start||!end)return showToast('请填写完整');
  if(!rate||rate<=0)return showToast('请填写时薪');
  localStorage.setItem('workRate',rate);
  const raw=calcRaw(start,end);if(brk>=raw)return showToast('休息不能超过工时');
  const wm=raw-brk,h=Math.round(wm/60*100)/100,earn=Math.round(h*rate*100)/100;
  records.push({id:Date.now(),type:'normal',date,start,end,breakMin:brk,rawMins:raw,workMins:wm,hours:h,rate,earning:earn,note});
  finishAdd(date,`实际 ${h}h，收入 ¥${earn.toFixed(2)}`);
  document.getElementById('nNote').value='';
}
function addTx(){
  const date=document.getElementById('txDate').value,hours=parseFloat(document.getElementById('txHours').value),reason=document.getElementById('txReason').value.trim();
  if(!date||!hours)return showToast('请填写完整');
  records.push({id:Date.now(),type:'tiaoxiu',date,hours,reason,start:'',end:'',breakMin:0,rawMins:0,workMins:0,rate:0,earning:0,note:''});
  finishAdd(date,`调休 ${hours}h`);
  document.getElementById('txReason').value='';
}
function addZb(){
  const date=document.getElementById('zbDate').value,start=document.getElementById('zbStart').value,end=document.getElementById('zbEnd').value;
  const brk=parseInt(document.getElementById('zbBreak').value)||0,rate=parseFloat(document.getElementById('zbRate').value);
  const orig=document.getElementById('zbOrig').value,note=document.getElementById('zbNote').value.trim();
  if(!date||!start||!end)return showToast('请填写完整');
  if(!rate||rate<=0)return showToast('请填写时薪');
  localStorage.setItem('workRate',rate);
  const raw=calcRaw(start,end);if(brk>=raw)return showToast('休息不能超过工时');
  const wm=raw-brk,h=Math.round(wm/60*100)/100,earn=Math.round(h*rate*100)/100;
  records.push({id:Date.now(),type:'zhuanban',date,start,end,breakMin:brk,rawMins:raw,workMins:wm,hours:h,rate,earning:earn,origDate:orig||'',note});
  finishAdd(date,`转班 ${h}h，¥${earn.toFixed(2)}`);
  document.getElementById('zbNote').value='';document.getElementById('zbOrig').value='';
}
function finishAdd(date,msg){
  records.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  save();selectedDate=date;render();showToast(msg);
}

function deleteRecord(id){
  records=records.filter(r=>r.id!==id);
  save();render();showToast('已删除');
}
function save(){localStorage.setItem('workRecordsV3',JSON.stringify(records));}

// === Calendar ===
function calNav(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  selectedDate=null;
  render();
}
function goToday(){
  calYear=now.getFullYear();calMonth=now.getMonth();
  selectedDate=todayStr;
  render();
}
function selectDay(dateStr){
  selectedDate=dateStr;
  render();
  // Scroll to detail
  setTimeout(()=>{
    const dd=document.getElementById('dayDetail');
    if(dd)dd.scrollIntoView({behavior:'smooth',block:'nearest'});
  },100);
}

function renderCal(){
  document.getElementById('calTitle').textContent=`${calYear}年${calMonth+1}月`;

  const first=new Date(calYear,calMonth,1);
  const last=new Date(calYear,calMonth+1,0);
  const totalDays=last.getDate();

  // Monday=0, Sunday=6
  let startDay=first.getDay()-1;
  if(startDay<0)startDay=6;

  const container=document.getElementById('calDays');
  let html='';

  // Prev month fill
  const prevLast=new Date(calYear,calMonth,0).getDate();
  for(let i=startDay-1;i>=0;i--){
    const d=prevLast-i;
    const m=calMonth===0?12:calMonth;
    const y=calMonth===0?calYear-1:calYear;
    const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    html+=`<div class="cal-day other" onclick="selectDay('${ds}')">${d}</div>`;
  }

  // Current month
  for(let d=1;d<=totalDays;d++){
    const ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=ds===todayStr;
    const isSel=ds===selectedDate;
    const dayRecs=records.filter(r=>r.date===ds);

    let dots='';
    if(dayRecs.length){
      const hasNormal=dayRecs.some(r=>r.type==='normal');
      const hasTx=dayRecs.some(r=>r.type==='tiaoxiu');
      const hasZb=dayRecs.some(r=>r.type==='zhuanban');
      dots='<div class="dots">';
      if(hasNormal)dots+='<span class="dot d-normal"></span>';
      if(hasTx)dots+='<span class="dot d-tx"></span>';
      if(hasZb)dots+='<span class="dot d-zb"></span>';
      dots+='</div>';
    }

    const cls=['cal-day'];
    if(isToday)cls.push('today');
    if(isSel)cls.push('selected');
    html+=`<div class="${cls.join(' ')}" onclick="selectDay('${ds}')">${d}${dots}</div>`;
  }

  // Next month fill
  const totalCells=startDay+totalDays;
  const remaining=totalCells%7===0?0:7-totalCells%7;
  for(let d=1;d<=remaining;d++){
    const m=calMonth===11?1:calMonth+2;
    const y=calMonth===11?calYear+1:calYear;
    const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    html+=`<div class="cal-day other" onclick="selectDay('${ds}')">${d}</div>`;
  }

  container.innerHTML=html;
}

function renderDetail(){
  const dd=document.getElementById('dayDetail');
  if(!selectedDate){dd.classList.add('hidden');return;}

  const dayRecs=records.filter(r=>r.date===selectedDate);
  const d=new Date(selectedDate+'T00:00:00');
  const weekday=WD[d.getDay()];
  const dateStr=selectedDate.replace(/-/g,' / ');

  // Calc day total
  const dayWork=dayRecs.filter(r=>r.type!=='tiaoxiu');
  const dayH=dayWork.reduce((s,r)=>s+r.hours,0);
  const dayE=dayWork.reduce((s,r)=>s+r.earning,0);

  let html=`<div class="dd-header">
    <div><span class="dd-date">${dateStr}</span><span class="dd-weekday">${weekday}</span></div>
    ${dayRecs.length?`<div class="dd-total">${dayH.toFixed(1)}h　¥${dayE.toFixed(0)}</div>`:''}
  </div>`;

  if(!dayRecs.length){
    html+=`<div class="dd-empty">
      <div style="font-size:28px;margin-bottom:8px;opacity:.3">&#128197;</div>
      <div>这天还没有记录</div>
      <div style="margin-top:8px">
        <button class="btn btn-ghost" onclick="openPanel('normal')" style="font-size:12px">+ 添加打卡</button>
      </div>
    </div>`;
  } else {
    dayRecs.forEach(r=>{
      if(r.type==='tiaoxiu'){
        html+=`<div class="dd-card t-tiaoxiu">
          <div class="dd-left">
            <div class="dd-type c-purple">调休${r.reason?' · '+r.reason:''}</div>
            <div class="dd-info"><span>${r.hours} 小时</span></div>
          </div>
          <div class="dd-right"><div class="dd-hours" style="color:var(--purple)">${r.hours}h</div><div class="dd-lbl">调休</div></div>
          <button class="dd-del" onclick="deleteRecord(${r.id})" title="删除">&#10005;</button>
        </div>`;
      } else {
        const isZb=r.type==='zhuanban';
        const typeLabel=isZb?'转班':'打卡';
        const typeColor=isZb?'c-blue':'c-gold';
        const rawH=(r.rawMins/60).toFixed(1);
        const brkLabel=r.breakMin>0?'-'+fmtBrk(r.breakMin):'';
        const origLabel=r.origDate?'原休 '+r.origDate.replace(/-/g,'/'):'';
        const noteLabel=r.note||'';
        const tags=[`${r.start}-${r.end}`,`${rawH}h`,brkLabel,`¥${r.rate}/h`,origLabel,noteLabel].filter(Boolean);

        html+=`<div class="dd-card ${isZb?'t-zhuanban':'t-normal'}">
          <div class="dd-left">
            <div class="dd-type ${typeColor}">${typeLabel}</div>
            <div class="dd-info">${tags.map((t,i)=>`<span>${t}</span>`).join('<span class="sep">·</span>')}</div>
          </div>
          <div class="dd-right">
            <div class="dd-hours">${r.hours.toFixed(1)}h</div>
            <div class="dd-earning">¥${r.earning.toFixed(0)}</div>
          </div>
          <button class="dd-del" onclick="deleteRecord(${r.id})" title="删除">&#10005;</button>
        </div>`;
      }
    });
  }
  dd.innerHTML=html;
  dd.classList.remove('hidden');
}

function renderSummary(){
  const ym=calYear+'-'+String(calMonth+1).padStart(2,'0');
  const mr=records.filter(r=>r.date.startsWith(ym));
  const mw=mr.filter(r=>r.type!=='tiaoxiu');
  const ms=mr.filter(r=>r.type==='tiaoxiu'||r.type==='zhuanban');
  document.getElementById('sHours').textContent=mw.reduce((s,r)=>s+r.hours,0).toFixed(1);
  document.getElementById('sEarn').textContent=mw.reduce((s,r)=>s+r.earning,0).toFixed(0);
  document.getElementById('sSpecial').textContent=ms.length;
  document.getElementById('sDays').textContent=mr.length;
}

function render(){
  renderCal();
  renderDetail();
  renderSummary();
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey&&panelType){if(panelType==='normal')addNormal();if(panelType==='tiaoxiu')addTx();if(panelType==='zhuanban')addZb();}});

render();
</script>
</body>
</html>
